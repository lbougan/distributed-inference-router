[project]
name = "inference-router-tools"
version = "0.2.0"
description = "Mock vLLM backend, load tester and docker-stack tests for the inference router"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bench = [
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "rich>=13.0",
]
mock = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["docker: needs the docker compose mock stack running"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["router-core"]
